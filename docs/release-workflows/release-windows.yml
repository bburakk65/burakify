name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörlerini hazırla
        shell: bash
        run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: ZIP ve SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "burakify-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "out/$name"
          (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File "out/$name.sha256" -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
