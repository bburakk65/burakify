name: Release Android

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörlerini hazırla
        shell: bash
        run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret tanımlı değil"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
      - name: key.properties yaz
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload.jks"
          } > android/key.properties
      # Gradle imzalama ayarını tool/configure_platforms.py ekler (key.properties okur).
      - run: flutter build apk --release
      - name: Adlandır ve SHA-256 üret
        shell: bash
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          TAG_VER="${GITHUB_REF_NAME#v}"
          # Etiket (v0.1.0) pubspec sürümüyle (0.1.0+1) başlamalı; uyuşmazsa dur.
          case "$VER" in "$TAG_VER"|"$TAG_VER"+*) ;; *) echo "Etiket $GITHUB_REF_NAME, pubspec $VER ile uyuşmuyor"; exit 1;; esac
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk "out/burakify-v${VER}.apk"
          cd out && sha256sum "burakify-v${VER}.apk" > "burakify-v${VER}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
